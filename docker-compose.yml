services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmlab
      POSTGRES_PASSWORD: llmlab_password
      POSTGRES_DB: llmlab
    ports:
      - "5432:5432"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmlab -d llmlab"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata: